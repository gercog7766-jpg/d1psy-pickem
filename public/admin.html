<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — D1PSY Pick’em</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header><div class="eyebrow">D1PSY COMMUNITY PICK’EM</div><h1>Admin</h1></header><section id="auth" class="card"><h2>Вход администратора</h2><label>Email<input id="email" type="email" autocomplete="username"></label><label>Пароль<input id="password" type="password" autocomplete="current-password"></label><button id="login">Войти</button></section><section id="panel" class="hidden"><div class="card row"><div><div class="eyebrow">ПРОГНОЗОВ</div><h1 id="count">0</h1></div><button id="signout" class="secondary">Выйти</button></div><section class="card"><h2>Дедлайн</h2><label>Дата и время (в выбранном часовом поясе)<input id="deadlineInput" type="datetime-local"></label><label>Часовой пояс<input id="timezone" value="Europe/Berlin"></label><button id="saveDeadline">Сохранить дедлайн</button></section><section class="card"><div class="row"><h2>Команды</h2><button id="saveTeams">Сохранить команды</button></div><div id="teams"></div></section><section class="card"><div class="row"><h2>Участники</h2><button id="csv" class="secondary">Экспорт CSV</button></div><label>Поиск<input id="search" placeholder="Twitch-ник"></label><div id="participants"></div></section><section id="detail" class="card hidden"></section></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
